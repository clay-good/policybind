# Prometheus configuration for PolicyBind monitoring
#
# This scrapes metrics from the PolicyBind API server.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # PolicyBind API server metrics
  - job_name: 'policybind'
    static_configs:
      - targets: ['policybind:8080']
    metrics_path: '/v1/metrics'
    scheme: http

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
